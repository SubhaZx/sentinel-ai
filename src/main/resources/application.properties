# Application name
spring.application.name=analyzer-service

# Server port
server.port=8081

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=analyzer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.sentinelai.analyzer.model.ErrorEvent
spring.kafka.consumer.enable-auto-commit=false

# Kafka Producer (needed for DLT publishing)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# MySQL Configuration
spring.datasource.url=jdbc:mysql://mysql:3306/sentinelai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Groq (OpenAI-compatible) Configuration
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}


# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379

# Redis cache TTL
spring.cache.type=redis
spring.cache.redis.time-to-live=24h

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.groqApi.sliding-window-size=5
resilience4j.circuitbreaker.instances.groqApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groqApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.groqApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.groqApi.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry Configuration
resilience4j.retry.instances.groqApi.max-attempts=3
resilience4j.retry.instances.groqApi.wait-duration=2s
resilience4j.retry.instances.groqApi.enable-exponential-backoff=true
resilience4j.retry.instances.groqApi.exponential-backoff-multiplier=2

spring.cloud.compatibility-verifier.enabled=false